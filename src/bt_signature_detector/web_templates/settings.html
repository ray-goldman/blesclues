<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf }}"><title>Settings · Bluetooth Detector</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div class="brand"><a href="/" class="mark">B</a><div><strong>Bluetooth Detector</strong><small>Configuration</small></div></div><a class="ghost link" href="/">Back to dashboard</a></header><main><section class="hero"><div><p class="eyebrow">DEVICE CONFIGURATION</p><h1>Settings</h1><p class="muted">Changes are validated before saving. Wi-Fi updates may briefly restart the access point.</p></div></section><form id="settings" class="panel form-grid"><label>Minimum RSSI (dBm)<input name="global_min_rssi" type="number" min="-127" max="20" placeholder="No global threshold"></label><label>Detection cooldown (seconds)<input name="cooldown_seconds" type="number" min="0" max="86400" required></label><label>Minimum observations<input name="min_observations" type="number" min="3" max="100000" required></label><label>Wi-Fi network name<input name="ssid" maxlength="32" required></label><label>Wi-Fi passphrase<input name="passphrase" type="password" minlength="8" maxlength="63" autocomplete="new-password" placeholder="Leave blank to keep current"></label><label>Wi-Fi channel<input name="channel" type="number" min="1" max="13" required></label><label>Regulatory country<input name="country" maxlength="2" minlength="2" required></label><label>HTTPS release manifest URL<input name="manifest_url" type="url" placeholder="https://updates.example.org/stable.json"></label><div class="form-actions"><button type="submit">Save settings</button><span id="result" class="muted" role="status"></span></div></form><form id="password" class="panel form-grid"><div><p class="eyebrow">ACCOUNT SECURITY</p><h2>Change UI password</h2></div><label>Current UI password<input name="old_password" type="password" required autocomplete="current-password"></label><label>New UI password<input name="new_password" type="password" minlength="12" required autocomplete="new-password"></label><div class="form-actions"><button type="submit">Change password</button><span id="password-result" class="muted" role="status"></span></div></form></main><script src="/static/settings.js" defer></script></body></html>
