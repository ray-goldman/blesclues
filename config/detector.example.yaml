schema_version: 1
bluetooth:
  scan_mode: passive
  # Replace this synthetic AD-pattern filter for the adapter and advertisements in use.
  # Passive BlueZ scanning requires at least one pattern and never falls back to active.
  or_patterns:
    - start_position: 0
      ad_data_type: 255
      pattern: "010203"
detection:
  signature_file: signatures.example.yaml
  min_observations: 3
  cooldown_seconds: 300
storage:
  path: /var/lib/bt-signature-detector/events.sqlite3
notifications:
  audio:
    enabled: false
  ntfy:
    enabled: false
  sms:
    enabled: false
access_point:
  enabled: false
  ssid: Detector-Admin
  passphrase: easypassword
  hidden: true
  interface_address: 192.168.4.1/24
  country: ""
  channel: 6
  profile_name: Detector-Admin
wifi_scanning:
  enabled: false
  interval_seconds: 15
web:
  enabled: true
  port: 8080
  password_hash_file: /var/lib/bt-signature-detector/web/ui-password.hash
  session_key_file: /var/lib/bt-signature-detector/web/ui-session.key
updates:
  enabled: true
  manifest_url: null
