[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bt-signature-detector"
version = "0.1.0b2"
description = "Headless BLE advertisement signature detector for Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "bleak>=3.0.0",
    "Flask>=3.0",
    "gunicorn>=23.0,<24",
    "cryptography>=43.0",
]

[project.optional-dependencies]
sms = ["twilio>=9.0,<10"]
dev = []

[project.scripts]
detector = "bt_signature_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bt_signature_detector = ["web_templates/*.html", "web_static/*.js", "web_static/*.css", "data/*.json", "data/source/*"]

[tool.setuptools.data-files]
"share/bt-signature-detector/systemd" = ["systemd/*.service", "systemd/*.sudoers"]
"share/bt-signature-detector/systemd/bluetooth.service.d" = ["systemd/bluetooth.service.d/*.conf"]
"share/bt-signature-detector/scripts" = ["scripts/apply_update_helper.sh", "scripts/restart_detector_helper.sh", "scripts/device_browser_helper.sh", "scripts/wifi_mode_helper.sh"]
